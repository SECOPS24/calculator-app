<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 50px; }
.calc { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 220px; }
input { width: 100%; margin: 5px 0; padding: 8px; box-sizing: border-box; }
select { width: 100%; margin: 5px 0; padding: 8px; }
button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
#result { margin-top: 15px; font-weight: bold; text-align: center; }
</style>
</head>
<body>
<div class="calc">
<input id="a" type="number" placeholder="Number A">
<select id="op">
<option value="+">+</option>
<option value="-">-</option>
<option value="*">*</option>
<option value="/">/</option>
</select>
<input id="b" type="number" placeholder="Number B">
<button onclick="calc()">Calculate</button>
<div id="result"></div>
</div>
<script>
async function calc() {
  const a = document.getElementById('a').value;
  const b = document.getElementById('b').value;
  const op = document.getElementById('op').value;
  const res = await fetch('/calculate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ a, b, op })
  });
  const data = await res.json();
  document.getElementById('result').textContent = data.result !== undefined ? 'Result: ' + data.result : 'Error: ' + data.error;
}
</script>
</body>
</html>
